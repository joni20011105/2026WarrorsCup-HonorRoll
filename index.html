<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 第二屆武士盃全國羽球錦標賽 — 榮譽榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--navy:#17263F;--navy2:#22385C;--paper:#E8E1D1;--paper2:#F2EDE1;
 --line:#DCD3BE;--seal:#B4362A;--muted:#7A705F;
 --g1:#A8842C;--g2:#8C8C94;--g3:#9A6A42;
 --gut:clamp(26px,4.5vw,56px);}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
 color:var(--ink);background:radial-gradient(130% 80% at 15% 0%,#F4F0E5 0%,var(--paper) 52%,#DBD2BE 100%);
 -webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;z-index:0;
 background-image:repeating-linear-gradient(94deg,rgba(120,105,80,.05) 0 1px,transparent 1px 4px)}
.serif{font-family:"Noto Serif TC","Yu Mincho",serif}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 var(--gut) 90px}

header{background:#000;margin:0;padding:48px 0 38px;position:relative;overflow:hidden}
header::after{content:"譽";position:absolute;right:calc(var(--gut) - 8px);top:-26px;font-family:"Noto Serif TC",serif;
 font-size:200px;font-weight:900;color:rgba(255,255,255,.05);line-height:1}
.hd{max-width:1240px;margin:0 auto;padding:0 var(--gut);position:relative}
.hd .pre{color:#9A9A9A;font-size:12.5px;letter-spacing:.3em;margin-bottom:11px}
.hd h1{font-family:"Noto Serif TC",serif;font-weight:900;margin:0;white-space:nowrap;
 font-size:clamp(17px,5.4vw,52px);letter-spacing:.05em;line-height:1.3;
 color:#C9CDD2;
 background:linear-gradient(180deg,#F2F4F6 0%,#C6CBD1 42%,#8E949B 62%,#DCE0E4 100%);
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@supports not (background-clip:text){.hd h1{-webkit-text-fill-color:#C9CDD2}}
.hd .sub{color:#9A9A9A;font-size:12.5px;margin-top:12px;letter-spacing:.06em;line-height:1.9}
.hd .sub b{color:#D8DCE0;font-weight:500}

.tools{position:sticky;top:0;z-index:5;background:rgba(242,237,225,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line);margin:0 0 26px;padding:12px 0}
.tools .in{max-width:1240px;margin:0 auto;padding:0 var(--gut);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:210px;max-width:340px;padding:9px 13px;border:1px solid var(--line);border-radius:3px;
 background:#FFFDF7;font-family:inherit;font-size:14px}
#q::placeholder{color:#B3A891}
select{padding:9px 11px;border:1px solid var(--line);border-radius:3px;background:#FFFDF7;
 font-family:inherit;font-size:14px;color:var(--ink);max-width:220px}
.tools .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;
 border-radius:2px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--ink);color:var(--paper2)}

.hits{margin:0 0 26px;border:1px solid var(--line);background:rgba(255,253,247,.75);border-radius:4px;padding:14px 16px}
.hits h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.24em;color:var(--muted)}
.hit{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.hit:first-of-type{border-top:0}
.hit .who{font-weight:700}
.hit .where{color:var(--muted);font-size:12.5px}
.hit .go{margin-left:auto;background:var(--navy);color:#F2EDE1;border:0;padding:4px 10px;border-radius:2px;
 font-size:12px;cursor:pointer;font-family:inherit}

section{margin-top:44px;scroll-margin-top:76px}
.sechd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:11px}
.sechd .eyebrow{font-size:11.5px;letter-spacing:.3em;color:var(--muted)}
.sechd h2{font-family:"Noto Serif TC",serif;font-size:clamp(22px,3.2vw,30px);margin:3px 0 0;
 letter-spacing:.07em;font-weight:900}
.sechd .meta{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.7}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:18px;margin-top:20px;align-items:start}
.card{background:linear-gradient(178deg,#FFFDF7,#F6F0E1);border:1px solid #C8BB9E;border-radius:3px;
 clip-path:polygon(0 13px,13px 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%);
 padding:14px 15px 13px;box-shadow:0 2px 8px rgba(60,45,20,.07)}
.card.hl{border-color:var(--seal);box-shadow:0 0 0 2px rgba(180,54,42,.28),0 2px 8px rgba(60,45,20,.1)}
.card .ch{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.card .ci{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900;line-height:1.25;letter-spacing:.04em}
.card .cd{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:2px}

.wn{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.wn:first-of-type{border-top:0}
.md{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;margin-top:1px;
 font-family:"Noto Serif TC",serif;font-size:12.5px;font-weight:900;color:#FFF8EC}
.md.m1{background:linear-gradient(160deg,#C9A440,#9A7A22)}
.md.m2{background:linear-gradient(160deg,#A9AAB2,#7E7F88)}
.md.m3{background:linear-gradient(160deg,#B4794C,#8A5833)}
.md.m4{background:#6E6557}
.md.m5{background:#FFFDF7;border:1.5px dashed #BDB19A;color:#8A7F6C;font-size:10px}
.wt{min-width:0;flex:1}
.wnm{font-size:14.5px;font-weight:700;line-height:1.45;word-break:break-word}
.wnm.sm{font-size:13px;font-weight:500;line-height:1.55}
.wu{font-size:11.5px;color:#4A5F82;line-height:1.5;margin-top:2px}
.wu.none{color:#B3A891}
.wa{font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-top:1px}

.notice{border:2px solid var(--seal);background:#FBF2EF;border-radius:4px;padding:18px 20px;margin-bottom:26px}
.notice h3{font-family:"Noto Serif TC",serif;font-size:19px;margin:0 0 10px;color:var(--seal);letter-spacing:.1em}
.notice p{margin:0 0 9px;font-size:14.5px;line-height:1.95}
.notice p:last-child{margin-bottom:0}
.fnote{margin-top:12px;background:#EDF1F7;border-left:3px solid var(--navy2);padding:10px 14px;
 font-size:13px;line-height:1.85;color:#2C4A63;border-radius:0 3px 3px 0}
.fnote .ftag{display:inline-block;background:var(--navy);color:var(--paper2);font-size:10.5px;
 padding:1px 7px;border-radius:2px;margin-right:8px;letter-spacing:.1em;vertical-align:1px}
.fnote.plain{background:#F3F0E7;border-left-color:#B9AB8D;color:var(--muted)}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0 24px}
.podium.two{grid-template-columns:repeat(2,1fr);max-width:820px;margin-left:auto;margin-right:auto}
.podium.two .sch{font-size:19px}
.podium.two .pts{font-size:44px}
.notice .em{font-weight:700;color:var(--seal)}
.pd{background:linear-gradient(178deg,#FFFDF7,#F6F0E1);border:1px solid #C8BB9E;border-radius:3px;
 clip-path:polygon(0 13px,13px 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%);
 padding:16px 15px 14px;text-align:center;box-shadow:0 2px 8px rgba(60,45,20,.07)}
.pd .rk{font-family:"Noto Serif TC",serif;font-size:13px;font-weight:900;letter-spacing:.2em;color:#FFF8EC;
 display:inline-block;padding:3px 13px;border-radius:2px}
.pd1 .rk{background:linear-gradient(160deg,#C9A440,#9A7A22)}
.pd2 .rk{background:linear-gradient(160deg,#A9AAB2,#7E7F88)}
.pd3 .rk{background:linear-gradient(160deg,#B4794C,#8A5833)}
.pd .sch{font-family:"Noto Serif TC",serif;font-size:16.5px;font-weight:900;margin:11px 0 8px;line-height:1.45}
.pd .pts{font-family:"Noto Serif TC",serif;font-size:36px;font-weight:900;line-height:1;color:var(--navy)}
.pd .ptl{font-size:10.5px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.pd .brk{font-size:11.5px;color:var(--muted);margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;line-height:1.7}

.tbl{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:3px;background:rgba(255,253,247,.8)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:660px}
th{background:#1B1A17;color:#E8E1D1;font-weight:500;font-size:11.5px;letter-spacing:.12em;
 padding:10px 12px;text-align:right;white-space:nowrap}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td:nth-child(1){color:var(--muted);font-family:"Noto Serif TC",serif;width:40px}
td:nth-child(2){text-align:left;font-weight:500;white-space:normal}
tr:nth-child(even) td{background:rgba(220,211,190,.18)}
td.tp{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:900;color:var(--navy)}
td.z{color:#C6BCA6}
tr.win td{background:#FBF4E4!important;font-weight:700}
tr.win td.z{font-weight:400}
.wtag{display:inline-block;background:#9A7A22;color:#FFF8EC;font-size:10px;padding:1px 7px;
 border-radius:2px;margin-left:8px;letter-spacing:.08em;vertical-align:1px;font-weight:500}
.tblh{font-family:"Noto Serif TC",serif;font-size:17px;margin:30px 0 4px;letter-spacing:.1em}
.tblnote{font-size:12.5px;color:var(--muted);line-height:1.7}

.rules{margin-top:26px;background:rgba(255,253,247,.7);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.rules h3{font-family:"Noto Serif TC",serif;font-size:17px;margin:0 0 12px;letter-spacing:.1em}
.rules ol{margin:0;padding-left:20px}
.rules li{font-size:14px;line-height:1.95;margin-bottom:8px}
.rules .eg{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;background:var(--navy);color:var(--paper2);font-size:11px;padding:1px 8px;
 border-radius:2px;margin-right:6px;letter-spacing:.06em}
.pill.p1{background:#9A7A22}.pill.p2{background:#7E7F88}.pill.p3{background:#8A5833}.pill.p4{background:#6E6557}

footer{margin-top:60px;border-top:1px solid var(--line);padding-top:16px;font-size:11.5px;color:var(--muted);line-height:1.9}
@media (max-width:760px){.podium{grid-template-columns:1fr}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.tools .cnt{display:none}}
@media print{
 .tools,.hits{display:none!important}
 body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #000}
 .hd .pre,.hd .sub{color:#000}
 .hd h1{color:#000;background:none;-webkit-text-fill-color:#000}
 header::after{display:none}
 section{break-inside:avoid}.card,.pd{break-inside:avoid;box-shadow:none}
 .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

</div></div>

<div class="wrap">
  <div id="hits"></div>
  <div id="body"></div>

<script>
const AW=JSON.parse(document.getElementById('awards').textContent);
const SP=JSON.parse(document.getElementById('spirit').textContent);
const E=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RK={'冠軍':1,'亞軍':2,'季軍':3,'並列季軍':3,'殿軍':4,'第 5～8 名':5};
const MD={1:'金',2:'銀',3:'銅',4:'殿',5:'5-8'};
const DIVS=[...new Set(AW.map(e=>e.div))];
let total=0; AW.forEach(e=>total+=e.w.length);

document.getElementById('hdsub').innerHTML=
 '賽事期間 <b>2026.10.09 － 10.11</b>　‧　共 <b>'+AW.length+'</b> 個項目產生名次　‧　<b>'+total+'</b> 筆得獎紀錄<br>'+
 '榮譽榜依大會公布之得獎名單製作；精神總錦標依各校報名人數與得名積分計算。';

const fd=document.getElementById('fdiv');
DIVS.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;fd.appendChild(o);});

function evid(e){return 'ev-'+DIVS.indexOf(e.div)+'-'+encodeURIComponent(e.item).replace(/%/g,'');}

function wrow(w){
  const r=RK[w.aw]||5;
  const multi=/[、]/.test(w.nm)||w.nm.split(' / ').length>2;
  return '<div class="wn">'+
    '<div class="md m'+r+'">'+MD[r]+'</div>'+
    '<div class="wt">'+
      '<div class="wnm'+(multi?' sm':'')+'">'+E(w.nm)+'</div>'+
      (w.u? '<div class="wu">'+E(w.u)+'</div>' : '<div class="wu none">未填寫所屬團體</div>')+
      (r>=3? '<div class="wa">'+E(w.aw)+'</div>':'')+
    '</div></div>';
}

function honor(hlDiv,hlEv){
  let h='';
  let cur=null;
  DIVS.forEach(d=>{
    if(hlDiv&&d!==hlDiv) return;
    const evs=AW.filter(e=>e.div===d);
    const cnt=evs.reduce((a,e)=>a+e.w.length,0);
    h+='<section id="div-'+DIVS.indexOf(d)+'"><div class="sechd">'+
       '<div><div class="eyebrow">DIVISION</div><h2 class="serif">'+E(d)+'</h2></div>'+
       '<div class="meta">'+evs.length+' 個項目　‧　'+cnt+' 筆得獎紀錄</div></div><div class="grid">';
    evs.forEach(e=>{
      h+='<div class="card'+(hlEv===evid(e)?' hl':'')+'" id="'+evid(e)+'">'+
         '<div class="ch"><div class="cd">'+E(e.div)+'</div><div class="ci serif">'+E(e.item)+'</div></div>'+
         e.w.map(wrow).join('')+'</div>';
    });
    h+='</div></section>';
  });
  return h;
}

  let h='<section><div class="sechd"><div><div class="eyebrow">SPIRIT TROPHY</div>'+
    '<h2 class="serif">🏆 精神總錦標</h2></div>'+
    '<div class="meta">本屆精神總錦標取前兩名　‧　積分榜列出前 '+SP.length+' 名</div></div>';
  h+='<div class="podium two">'+win.map((r,i)=>
    '<div class="pd pd'+(i+1)+'"><span class="rk serif">第 '+(i+1)+' 名</span>'+
    '<div class="sch serif">'+E(r[0])+'</div>'+
    '<div class="pts serif">'+r[1]+'</div><div class="ptl">總積分</div>'+
    '<div class="brk">初始積分 '+r[2]+
      (r[3]?'　‧　冠軍 '+r[3]:'')+(r[4]?'　‧　亞軍 '+r[4]:'')+
      (r[5]?'　‧　季軍 '+r[5]:'')+(r[6]?'　‧　殿軍 '+r[6]:'')+'</div></div>').join('')+'</div>';
  h+='<h3 class="tblh serif">積分榜</h3><div class="tblnote">以下為各校積分排名，前兩名獲頒本屆精神總錦標。</div>'+
     '<div class="tbl"><table><thead><tr><th></th><th>學校名稱</th><th>總積分</th><th>初始積分</th>'+
     '<th>第一名總數 (15分)</th><th>第二名總數 (10分)</th><th>第三名總數 (5分)</th><th>第四名總數 (3分)</th></tr></thead><tbody>'+
     SP.map((r,i)=>'<tr'+(i<2?' class="win"':'')+'><td>'+(i+1)+'.</td>'+
       '<td>'+E(r[0])+(i<2?'<span class="wtag">精神總錦標</span>':'')+'</td>'+
       '<td class="tp">'+r[1]+'</td><td>'+r[2]+'</td>'+
       r.slice(3).map(v=>'<td'+(v?'':' class="z"')+'>'+v+'</td>').join('')+'</tr>').join('')+
     '</tbody></table></div>';
  h+='<div class="rules"><h3 class="serif">🔔 精神總錦標積分計算方法</h3><ol>'+
     '<li><b>初始積分</b>：該學校報名人數 +1 分（依照學校報名人頭數取分，不關報名項目）。'+
     '<span class="eg">例如：武士學校，A 學生報名單雙打，總積分也只有加 1 分。</span></li>'+
     '<li><b>得名積分</b>：<span class="pill p1">冠軍 +15</span><span class="pill p2">亞軍 +10</span>'+
     '<span class="pill p3">季軍 +5</span><span class="pill p4">殿軍 +3</span>'+
     '如雙打是不同學校組隊報名並得獎，則雙學校各得分。'+
     '<span class="eg">例如：黑武配白武得冠軍，黑武、白武學校各得 15 分。</span></li></ol></div>';
  h+='<div class="notice" style="margin-top:26px"><h3>📣 注意事項</h3>'+
     '<p>1. 本屆共 94 所學校參與計分，<span class="em">精神總錦標僅取前兩名</span>；上方積分榜列出積分前 '+SP.length+' 名供各校參考，名次依大會系統公布之積分結果。</p>'+
     '<p>2. 雙打若由不同學校組隊報名並得獎，兩校各自計分。</p>'+
     '<p>3. 精神總錦標如有任何問題，請至報到處尋高偉哲／杜鎮宇洽詢。</p></div>';
  h+='</section>';
  return h;
}

function search(){
  const kw=document.getElementById('q').value.trim();
  const box=document.getElementById('hits');
  if(!kw||document.getElementById('view').value!=='honor'){box.innerHTML='';return [];}
  const k=kw.toLowerCase();
  const out=[];
  AW.forEach(e=>e.w.forEach(w=>{
    if((w.nm+' '+w.u).toLowerCase().includes(k)) out.push({e:e,w:w});
  }));
  if(!out.length){box.innerHTML='<div class="hits"><h4>查詢結果</h4><div class="hit"><span class="where">查無「'+E(kw)+'」的得獎紀錄。</span></div></div>';return [];}
  box.innerHTML='<div class="hits"><h4>查詢結果　'+out.length+' 筆</h4>'+out.slice(0,40).map(o=>
    '<div class="hit"><span class="who">'+E(o.w.nm)+'</span>'+
    '<span class="where">'+E(o.e.div)+'　'+E(o.e.item)+'　'+E(o.w.aw)+(o.w.u?'　‧　'+E(o.w.u):'')+'</span>'+
    '<button class="go" data-t="'+evid(o.e)+'">看項目</button></div>').join('')+
    (out.length>40?'<div class="hit"><span class="where">（僅顯示前 40 筆，請縮小查詢範圍）</span></div>':'')+'</div>';
  box.querySelectorAll('.go').forEach(b=>b.onclick=()=>{
    document.getElementById('fdiv').value='';
    render(b.dataset.t);
    const el=document.getElementById(b.dataset.t);
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  });
  return out;
}

function render(hlEv){
  const v=document.getElementById('view').value;
  const d=document.getElementById('fdiv').value;
  document.getElementById('fdiv').style.display = v==='honor'?'':'none';
  document.getElementById('q').style.display = v==='honor'?'':'none';
  if(v==='spirit'){
    document.getElementById('body').innerHTML=spirit();
    document.getElementById('cnt').textContent='精神總錦標　前 '+SP.length+' 名';
    document.getElementById('hits').innerHTML='';
  }else{
    document.getElementById('body').innerHTML=honor(d,hlEv);
    const evs=d?AW.filter(e=>e.div===d):AW;
    const n=evs.reduce((a,e)=>a+e.w.length,0);
    document.getElementById('cnt').textContent=evs.length+' 個項目　‧　'+n+' 筆得獎紀錄';
  }
  document.getElementById('foot').innerHTML=
    '2026 第二屆武士盃全國羽球錦標賽　榮譽榜＋精神總錦標<br>'+
    '得獎名單依大會公布之得獎名單（2026/10/13）製作；並列季軍表示該項目未進行季軍戰，準決賽落敗兩隊同列第三。<br>'+
    '未產生獎項的項目：社會組男雙 巔峰對決。如名次有疑義，請至報到處與大會聯繫。';
}

document.getElementById('view').onchange=()=>{render();window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('fdiv').onchange=()=>render();
document.getElementById('q').oninput=search;
render();
</script>
